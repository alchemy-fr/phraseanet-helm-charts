{{- if eq .Values.saml.enabled true }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phraseanet-saml-sp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phraseanet
      tier: saml-sp
  template:
    metadata:
      labels:
        app: phraseanet
        tier: saml-sp
      {{- template "saml.annotations" . }}
    spec:
    {{- if .Values.nodeSelector }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
    {{- end }}
      volumes:
      {{- if eq .Values.saml.saml_configmap.enabled true }}
      - name: phraseanet-saml-idp-config-dir
        configMap:
          name: {{ .Values.app.phraseanet_hostname }}-saml-config
          items:
            - key: saml20-idp-remote.php
              path: saml20-idp-remote.php
      {{ else }}
      - name: phraseanet-saml-idp-config-dir
        persistentVolumeClaim:
          claimName: {{ .Values.saml.pvc.idp.name }}
      {{- end }}
      # the simplesamlphp config dir is the saml-authentication plugin config dir of phraseanet :
      # config.php is shared with phraseanet (generated by the container only if it does not exist)
      - name: phraseanet-config
        persistentVolumeClaim:
          claimName: {{ .Values.app.pvc.config.name }}
      {{- if eq .Values.saml.saml_secrets.enabled true }}
      - name: phraseanet-saml-sp-cert-dir
        secret:
          secretName: {{ .Values.app.phraseanet_hostname }}-saml-secret
      {{ else }}
      - name: phraseanet-saml-sp-cert-dir
        persistentVolumeClaim:
          claimName: {{ .Values.saml.pvc.cert.name }}
      {{- end }}
      containers:
      - name: phraseanet-saml-sp
        image: {{ .Values.saml.image.registry | default .Values.image.registry }}/phraseanet-saml-sp:{{ .Values.saml.image.tag | default .Values.image.tag.phraseanet_saml_sp | default "latest" }}
        imagePullPolicy: {{ .Values.saml.image.imagePullPolicy | default .Values.image.imagePullPolicy }}
        terminationMessagePolicy: FallbackToLogsOnError
        resources:
{{ toYaml .Values.app.web.resources | indent 12 }}
        volumeMounts:
        - name: phraseanet-saml-idp-config-dir
          mountPath: "/var/www/simplesamlphp/metadata"
        - name: phraseanet-config
          mountPath: "/var/www/simplesamlphp/config"
          subPath: plugins/saml-authentication
        - name: phraseanet-saml-sp-cert-dir
          mountPath: "/var/www/simplesamlphp/cert"

        env:
        - name: MAX_BODY_SIZE
          value: {{ .Values.http.max_body_size | quote }}
        - name: GATEWAY_PROXY_TIMEOUT
          value: "1200"
        - name: GATEWAY_FASTCGI_TIMEOUT
          value: "1200"
        - name: SESSION_SAVE_HANDLER
          value: {{ .Values.php.session_save_handler | quote }}
        - name: SESSION_SAVE_PATH
          value: {{ .Values.php.session_save_path | quote }}
        - name: SAML_PHRASEANET_HOST
          value: {{ .Values.saml.saml_phraseanet_host | quote }}
        - name: SAML_SP_AUTHSOURCES
          value: {{ .Values.saml.saml_sp_authsources | quote }}
        - name: SAML_ALLOW_DEBUG
          value: {{ .Values.saml.saml_allow_debug | quote }}
        - name: SAML_REDIS_HOST
          value: {{ .Values.saml.saml_redis_host | quote }}
        - name: SAML_REDIS_PORT
          value: {{ .Values.saml.saml_redis_port | quote }}
        - name: SAML_SECRET_SALT
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.phraseanet_hostname }}-saml-sp-env
              key: SAML_SECRET_SALT
        - name: SAML_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.app.phraseanet_hostname }}-saml-sp-env
              key: SAML_ADMIN_PASSWORD
{{- end }}
