{{- if eq .Values.saml.enabled true }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.app.phraseanet_hostname }}-saml-sp-env
type: Opaque
data:
  SAML_SECRET_SALT: {{ .Values.saml.saml_secret_salt | default "" | toString | b64enc | quote }}
  SAML_ADMIN_PASSWORD: {{ .Values.saml.saml_admin_password | default "" | toString | b64enc | quote }}
{{- end }}
